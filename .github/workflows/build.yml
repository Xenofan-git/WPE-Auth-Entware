name: Build WPE Auth Entware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 python3-pip git curl xz-utils gperf unifdef             libglib2.0-dev libicu-dev libgcrypt20-dev libsoup-3.0-dev libtasn1-6-dev libxkbcommon-dev libfontconfig1-dev libdrm-dev             libxml2-dev libxslt1-dev libsqlite3-dev libjpeg-dev libpng-dev libharfbuzz-dev libhyphen-dev libseccomp-dev libsystemd-dev libwoff-dev             libepoxy-dev libavif-dev libwebp-dev
      - name: Install portable CMake 3.30
        run: |
          set -eux
          mkdir -p "$HOME/cmake"
          curl -fL --retry 5 https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake" --strip-components=1
          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"
          "$HOME/cmake/bin/cmake" --version

      - name: Inspect target GLib development files
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          find "$TARGET" -maxdepth 5 \\( -name 'glib-2.0.pc' -o -name 'glib.h' -o -name 'libglib-2.0.so*' \\) -print | head -100
          find "$TARGET" -maxdepth 4 -type d -name pkgconfig -print
          pkg-config --print-search-paths || true

      - name: Download WPE WebKit 2.54.0
        run: |
          curl -fL --retry 5 https://wpewebkit.org/releases/wpewebkit-2.54.0.tar.xz -o wpewebkit-2.54.0.tar.xz
          echo "efa9bcc3cb891c2d88f50eec710d9ccee71cbdf1040420361eb98c17355eb452  wpewebkit-2.54.0.tar.xz" | sha256sum -c -
          tar -xf wpewebkit-2.54.0.tar.xz
      - name: Apply WPE 2.54 headless build patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("wpewebkit-2.54.0/Source/WebCore/bindings/js/JSHTMLMediaElementCustom.cpp").write_text(
              '#include "config.h"\n#if 0 /* media disabled for headless auth build */\n#endif\n')
          p=Path("wpewebkit-2.54.0/Source/WebKit/UIProcess/wpe/AcceleratedBackingStore.cpp")
          s=p.read_text()
          if "DRM_FORMAT_XRGB8888 0x34325258U" not in s:
              p.write_text("#ifndef DRM_FORMAT_XRGB8888\n#define DRM_FORMAT_XRGB8888 0x34325258U\n#endif\n"+s)
          PY
      - name: Configure WPE
        run: |
          cmake -S wpewebkit-2.54.0 -B build-wpe -G Ninja -DPORT=WPE -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/wpe-install"             -DENABLE_WPE_LEGACY_API=OFF -DENABLE_INTROSPECTION=OFF -DENABLE_DOCUMENTATION=OFF -DENABLE_WPE_PLATFORM_DRM=OFF             -DENABLE_WPE_PLATFORM_WAYLAND=OFF -DENABLE_WPE_QT_API=OFF -DENABLE_JOURNALD_LOG=OFF -DENABLE_SPEECH_SYNTHESIS=OFF             -DENABLE_SPELLCHECK=OFF -DENABLE_BUBBLEWRAP_SANDBOX=OFF -DUSE_ATK=OFF -DUSE_AVIF=OFF -DUSE_JPEGXL=OFF             -DUSE_LIBINPUT=OFF -DUSE_LCMS=OFF -DUSE_GBM=OFF -DUSE_LIBDRM=OFF -DUSE_LIBBACKTRACE=OFF -DUSE_SYSPROF_CAPTURE=OFF             -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF -DENABLE_GPU_PROCESS=OFF -DUSE_VULKAN=OFF -DENABLE_WEBDRIVER=OFF -DENABLE_GAMEPAD=OFF             -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF -DENABLE_SPELLCHECKING=OFF -DUSE_GSTREAMER=OFF -DUSE_GSTREAMER_WEBRTC=OFF             -DUSE_OPENGL=OFF -DUSE_LIBHYPHEN=OFF -DENABLE_WEBXR=OFF -DENABLE_WEB_RTC=OFF -DENABLE_PDFJS=OFF -DENABLE_WEB_CODECS=OFF             -DENABLE_MHTML=OFF -DENABLE_NOTIFICATIONS=OFF -DENABLE_OFFSCREEN_CANVAS=OFF -DENABLE_OFFSCREEN_CANVAS_IN_WORKERS=OFF             -DENABLE_PERIODIC_MEMORY_MONITOR=OFF -DENABLE_SHAREABLE_RESOURCE=OFF -DENABLE_TOUCH_EVENTS=OFF -DENABLE_VARIATION_FONTS=OFF             -DENABLE_MOUSE_CURSOR_SCALE=OFF -DENABLE_POINTER_LOCK=OFF -DENABLE_RESOURCE_USAGE=OFF -DENABLE_MEMORY_SAMPLER=OFF             -DENABLE_API_TESTS=OFF -DENABLE_LAYOUT_TESTS=OFF -DENABLE_MINIBROWSER=OFF
      - name: Build and stage WPE
        run: |
          cmake --build build-wpe --parallel 2
          cmake --install build-wpe
      - name: Build probe
        run: |
          cmake -S . -B build-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/wpe-install" -DPKG_CONFIG_PATH="$PWD/wpe-install/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake --build build-probe --parallel 2
      - name: Package native artifact
        run: |
          mkdir -p dist/wpe-auth
          cp build-probe/wpe-auth dist/wpe-auth/
          cp README.md dist/wpe-auth/
          tar -C dist -czf wpe-auth-native.tar.gz wpe-auth
      - uses: actions/upload-artifact@v4
        with:
          name: wpe-auth-native
          path: wpe-auth-native.tar.gz

  verify-entware-toolchain:
    runs-on: ubuntu-latest
    container:
      image: waujito/entware_builder:aarch64-3.10
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Entware target toolchain
        working-directory: /home/me/Entware
        run: |
          set -eux
          test -x /home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27/bin/aarch64-openwrt-linux-gnu-gcc
          CC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27/bin/aarch64-openwrt-linux-gnu-gcc
          $CC --version
          printf 'int main(void){return 0;}\n' >/tmp/probe.c
          $CC -O2 -mcpu=cortex-a53 -Wl,--dynamic-linker=/opt/lib/ld-linux-aarch64.so.1 /tmp/probe.c -o /tmp/probe
          file /tmp/probe
          readelf -l /tmp/probe | grep 'Requesting program interpreter'
          readelf -V /tmp/probe | grep 'GLIBC_2.27' || true
      - name: Upload ARM64 toolchain probe
        uses: actions/upload-artifact@v4
        with:
          name: entware-aarch64-toolchain-probe
          path: /tmp/probe

  build-arm64-entware:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: waujito/entware_builder:aarch64-3.10
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build host tools
        run: |
          set -eux
          # The builder image is Debian bullseye and its security mirror may
          # contain stale package indexes. Install only host tools from the
          # main repository; curl/xz/git are already present in the image.
          if command -v apt-get >/dev/null 2>&1; then
            sed -i '/bullseye-security/d' /etc/apt/sources.list || true
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build pkg-config gperf unifdef ruby
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache cmake ninja pkgconf python3 gperf unifdef
          else
            echo "No supported package manager in Entware builder"
            cat /etc/os-release || true
            exit 1
          fi
          command -v cmake
          command -v ninja
          command -v pkg-config
          command -v curl
          command -v xz

      - name: Install portable CMake 3.30 for ARM64 build
        run: |
          set -eux
          mkdir -p "$HOME/cmake"
          curl -fL --retry 5 https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake" --strip-components=1
          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/cmake/bin:$PATH"
          cmake --version

      - name: Install Clang runtime compatibility
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            sed -i '/bullseye-security/d' /etc/apt/sources.list || true
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libtinfo5
          fi

      - name: Install portable Clang 18 for ARM64 build
        run: |
          set -eux
          mkdir -p "$HOME/llvm"
          curl -fL --retry 5 https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz -o /tmp/llvm.tar.xz
          tar -xJf /tmp/llvm.tar.xz -C "$HOME/llvm" --strip-components=1
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/llvm/bin:$PATH"
          clang --version
          clang++ --version

      - name: Inspect Entware target sysroot
        working-directory: /home/me/Entware
        run: |
          set -eux
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          test -d "$TC"
          test -d "$TARGET"
          ls -ld "$TC" "$TARGET"
          "$TC/bin/aarch64-openwrt-linux-gnu-gcc" --version
          cmake --version
          ninja --version
          pkg-config --version
          python3 --version

      - name: Inspect Entware target GLib development files
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          echo "=== target top ==="
          find "$TARGET" -maxdepth 5 \( -name 'glib-2.0.pc' -o -name 'glib.h' -o -name 'libglib-2.0.so*' \) -print | head -100
          echo "=== pkgconfig dirs ==="
          find "$TARGET" -type d -name pkgconfig -print | head -100
          echo "=== compiler sysroot headers ==="
          find "$TC/aarch64-openwrt-linux-gnu/sysroot" -maxdepth 4 \( -name 'features.h' -o -name 'stdlib.h' \) -print | head -50
          echo "=== target includes ==="
          ls -la "$TARGET/usr/include" 2>/dev/null | head -50 || true
          ls -la "$TARGET/opt/include" 2>/dev/null | head -50 || true
          echo "=== target glib ==="
          find "$TARGET/usr" "$TARGET/opt" -maxdepth 6 -type f \( -name 'glib.h' -o -name 'libglib-2.0.so*' -o -name 'glib-2.0.pc' \) -print 2>/dev/null | head -100
          echo "=== target pkgconfig files ==="
          find "$TARGET" -type f -name '*.pc' -print | head -100
          echo "=== native pkg-config search ==="
          pkg-config --print-search-paths || true

      - name: Inspect Entware target GLib development files
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          echo '=== GLib files ==='
          find "$TARGET" -type f \( -name 'glib-2.0.pc' -o -name 'glib.h' -o -name 'libglib-2.0.so*' \) -print | head -100
          echo '=== pkgconfig dirs ==='
          find "$TARGET" -type d -name pkgconfig -print | head -100
          echo '=== target include roots ==='
          find "$TARGET" -maxdepth 3 -type d -name include -print
          echo '=== sysroot headers ==='
          find "$TC/aarch64-openwrt-linux-gnu/sysroot" -maxdepth 5 \( -name features.h -o -name stdlib.h \) -print | head -50
          echo '=== likely Entware staging headers ==='
          find "$TC" -type f \( -name features.h -o -name glib.h \) -print | head -100
          echo '=== GLib pkg-config candidates ==='
          find /home/me/Entware/staging_dir -type f -name 'glib-2.0.pc' -print | head -100
          echo '=== target libraries ==='
          find "$TARGET" -type f \( -name 'libglib-2.0.so*' -o -name 'libgobject-2.0.so*' \) -print | head -100

      - name: Bootstrap Entware target development sysroot
        working-directory: /home/me/Entware
        run: |
          set -eux
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          mkdir -p "$TARGET/opt"
          curl -fL --retry 5 https://bin.entware.net/aarch64-k3.10/include/include.tar.gz -o /tmp/entware-include.tar.gz
          tar -xzf /tmp/entware-include.tar.gz -C "$TARGET/opt"
          python3 - <<'PY'
          import gzip, re, subprocess, urllib.request
          from pathlib import Path
          base='https://bin.entware.net/aarch64-k3.10/'
          target=Path('/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27')
          raw=gzip.decompress(urllib.request.urlopen(base+'Packages.gz').read()).decode()
          pkgs={}
          for block in raw.split('\\n\\n'):
              fields={}
              for line in block.splitlines():
                  if ': ' in line:
                      k,v=line.split(': ',1); fields[k]=v
              if fields.get('Package') and fields.get('Filename'):
                  pkgs[fields['Package']]=fields
          wanted={'glib2','icu','libsoup3','libtasn1','libxkbcommon','fontconfig','libxml2','libxml2-dev','libxslt','libsqlite3','libjpeg-turbo','libpng','libwebp'}
          selected=set()
          queue=list(wanted)
          while queue:
              name=queue.pop()
              if name in selected or name not in pkgs: continue
              selected.add(name)
              deps=pkgs[name].get('Depends','')
              for d in deps.split(','):
                  d=d.strip()
                  if not d: continue
                  for alt in d.split('|'):
                      m=re.match(r'([A-Za-z0-9+_.-]+)',alt.strip())
                      if m and m.group(1) in pkgs:
                          queue.append(m.group(1)); break
          print('Selected target packages:', sorted(selected))
          for name in sorted(selected):
              f=pkgs[name]['Filename']
              out=Path('/tmp')/Path(f).name
              urllib.request.urlretrieve(base+f,out)
              subprocess.run(['ar','x',str(out)],cwd='/tmp/ipk-'+name,check=False) if False else None
              d=Path('/tmp/ipk-'+name); d.mkdir(exist_ok=True)
              subprocess.run(['ar','x',str(out)],cwd=d,check=True)
              data=next(d.glob('data.tar.*'))
              subprocess.run(['tar','-xf',str(data),'-C',str(target)],check=True)
          PY
          echo '=== bootstrapped GLib/pkgconfig ==='
          find "$TARGET/opt" -type f \( -name 'glib-2.0.pc' -o -name 'gio-2.0.pc' -o -name 'gobject-2.0.pc' -o -name 'libglib-2.0.so*' \) -print | head -100

      - name: Download WPE WebKit 2.54.0
        run: |
          curl -fL --retry 5 https://wpewebkit.org/releases/wpewebkit-2.54.0.tar.xz -o wpewebkit-2.54.0.tar.xz
          echo "efa9bcc3cb891c2d88f50eec710d9ccee71cbdf1040420361eb98c17355eb452  wpewebkit-2.54.0.tar.xz" | sha256sum -c -
          tar -xf wpewebkit-2.54.0.tar.xz

      - name: Apply WPE headless patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("wpewebkit-2.54.0/Source/WebCore/bindings/js/JSHTMLMediaElementCustom.cpp").write_text(
              '#include "config.h"\n#if 0 /* media disabled for headless auth build */\n#endif\n')
          p=Path("wpewebkit-2.54.0/Source/WebKit/UIProcess/wpe/AcceleratedBackingStore.cpp")
          s=p.read_text()
          if "DRM_FORMAT_XRGB8888 0x34325258U" not in s:
              p.write_text("#ifndef DRM_FORMAT_XRGB8888\n#define DRM_FORMAT_XRGB8888 0x34325258U\n#endif\n"+s)
          PY

      - name: Configure WPE for ARM64 Entware
        working-directory: /home/me/Entware
        run: |
          set -eux
          TC=/home/me/Entware/staging_dir/toolchain-aarch64_cortex-a53_gcc-8.4.0_glibc-2.27
          TARGET=/home/me/Entware/staging_dir/target-aarch64_cortex-a53_glibc-2.27
          cd "$GITHUB_WORKSPACE"
          cat > entware-aarch64.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER $HOME/llvm/bin/clang)
          set(CMAKE_CXX_COMPILER $HOME/llvm/bin/clang++)
          set(CMAKE_C_COMPILER_TARGET aarch64-openwrt-linux-gnu)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-openwrt-linux-gnu)
          set(CMAKE_AR $TC/bin/aarch64-openwrt-linux-gnu-ar)
          set(CMAKE_RANLIB $TC/bin/aarch64-openwrt-linux-gnu-ranlib)
          set(CMAKE_STRIP $TC/bin/aarch64-openwrt-linux-gnu-strip)
          set(CMAKE_SYSROOT $TC/aarch64-openwrt-linux-gnu/sysroot)
          set(CMAKE_FIND_ROOT_PATH $TARGET $TC/aarch64-openwrt-linux-gnu/sysroot)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(CMAKE_C_FLAGS "--target=aarch64-openwrt-linux-gnu --sysroot=$TARGET --gcc-toolchain=$TC -B$TC/bin -mcpu=cortex-a53 -isystem $TC/include -isystem $TARGET/usr/include -isystem $TARGET/opt/include -isystem $TARGET/opt/lib/glib-2.0/include")
          set(CMAKE_CXX_FLAGS "--target=aarch64-openwrt-linux-gnu --sysroot=$TC/aarch64-openwrt-linux-gnu/sysroot --gcc-toolchain=$TC -B$TC/bin -mcpu=cortex-a53")
          EOF
          export PKG_CONFIG_SYSROOT_DIR="$TARGET"
          export PKG_CONFIG_LIBDIR="$TARGET/opt/lib/pkgconfig:$TARGET/usr/lib/pkgconfig:$TARGET/usr/share/pkgconfig"
          export PKG_CONFIG_PATH=""
          cmake -S "$GITHUB_WORKSPACE/wpewebkit-2.54.0" -B "$GITHUB_WORKSPACE/build-wpe-arm64" -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/entware-aarch64.cmake"             -DPORT=WPE             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX=/opt/wpe             -DENABLE_WPE_LEGACY_API=OFF             -DENABLE_INTROSPECTION=OFF             -DENABLE_DOCUMENTATION=OFF             -DENABLE_WPE_PLATFORM_DRM=OFF             -DENABLE_WPE_PLATFORM_WAYLAND=OFF             -DENABLE_WPE_QT_API=OFF             -DENABLE_JOURNALD_LOG=OFF             -DENABLE_SPEECH_SYNTHESIS=OFF             -DENABLE_SPELLCHECK=OFF             -DENABLE_BUBBLEWRAP_SANDBOX=OFF             -DUSE_ATK=OFF -DUSE_AVIF=OFF -DUSE_JPEGXL=OFF -DUSE_LIBINPUT=OFF -DUSE_LCMS=OFF             -DUSE_GBM=OFF -DUSE_LIBDRM=OFF -DUSE_LIBBACKTRACE=OFF             -DUSE_SYSPROF_CAPTURE=OFF -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF             -DENABLE_GPU_PROCESS=OFF -DUSE_VULKAN=OFF -DENABLE_WEBDRIVER=OFF -DENABLE_GAMEPAD=OFF             -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF -DENABLE_SPELLCHECKING=OFF             -DUSE_GSTREAMER=OFF -DUSE_GSTREAMER_WEBRTC=OFF -DUSE_OPENGL=OFF             -DUSE_LIBHYPHEN=OFF -DENABLE_WEBXR=OFF -DENABLE_WEB_RTC=OFF             -DENABLE_PDFJS=OFF -DENABLE_WEB_CODECS=OFF -DENABLE_MHTML=OFF             -DENABLE_NOTIFICATIONS=OFF -DENABLE_OFFSCREEN_CANVAS=OFF             -DENABLE_OFFSCREEN_CANVAS_IN_WORKERS=OFF -DENABLE_PERIODIC_MEMORY_MONITOR=OFF             -DENABLE_SHAREABLE_RESOURCE=OFF -DENABLE_TOUCH_EVENTS=OFF -DENABLE_VARIATION_FONTS=OFF             -DENABLE_MOUSE_CURSOR_SCALE=OFF -DENABLE_POINTER_LOCK=OFF -DENABLE_RESOURCE_USAGE=OFF             -DENABLE_MEMORY_SAMPLER=OFF -DENABLE_API_TESTS=OFF -DENABLE_LAYOUT_TESTS=OFF             -DENABLE_MINIBROWSER=OFF
