name: Build WPE Auth Entware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-wpe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake ninja-build pkg-config             python3 python3-pip git curl xz-utils gperf unifdef             libglib2.0-dev libicu-dev libgcrypt20-dev libsoup-3.0-dev libtasn1-6-dev             libxkbcommon-dev libfontconfig1-dev libdrm-dev             libxml2-dev libxslt1-dev libsqlite3-dev libjpeg-dev libpng-dev             libharfbuzz-dev libhyphen-dev libseccomp-dev libsystemd-dev libwoff-dev             libepoxy-dev libavif-dev libwebp-dev

      - name: Download WPE WebKit 2.54.0
        run: |
          curl -fL --retry 5             https://wpewebkit.org/releases/wpewebkit-2.54.0.tar.xz             -o wpewebkit-2.54.0.tar.xz
          echo "efa9bcc3cb891c2d88f50eec710d9ccee71cbdf1040420361eb98c17355eb452  wpewebkit-2.54.0.tar.xz" | sha256sum -c -
          tar -xf wpewebkit-2.54.0.tar.xz

      - name: Patch WPE 2.54.0 disabled media binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("wpewebkit-2.54.0/Source/WebCore/bindings/js/JSHTMLMediaElementCustom.cpp")
          # WPE 2.54.0 can still compile this custom binding with media disabled.
          # The generated JSHTMLMediaElement class is absent in this configuration.
          p.write_text('#include "config.h"\\n#if 0 /* media disabled for headless auth build */\\n#endif\\n')
          PY

      - name: Patch WPE 2.54.0 DRM format header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("wpewebkit-2.54.0/Source/WebKit/UIProcess/wpe/AcceleratedBackingStore.cpp")
          s = p.read_text()
          if "#include <drm_fourcc.h>" not in s:
              lines = s.splitlines()
              insert = 0
              for i, line in enumerate(lines):
                  if line.startswith("#include "):
                      insert = i + 1
              lines.insert(insert, "#include <drm_fourcc.h>")
              p.write_text("\n".join(lines) + "\n")
          PY

      - name: Configure WPE WebKit
        run: |
          cmake -S wpewebkit-2.54.0 -B build-wpe -G Ninja             -DPORT=WPE             -DCMAKE_BUILD_TYPE=Release             -DENABLE_WPE_LEGACY_API=OFF             -DENABLE_INTROSPECTION=OFF             -DENABLE_DOCUMENTATION=OFF             -DENABLE_WPE_PLATFORM_DRM=OFF             -DENABLE_WPE_PLATFORM_WAYLAND=OFF             -DENABLE_WPE_QT_API=OFF             -DENABLE_JOURNALD_LOG=OFF             -DENABLE_SPEECH_SYNTHESIS=OFF             -DENABLE_SPELLCHECK=OFF             -DENABLE_BUBBLEWRAP_SANDBOX=OFF             -DUSE_ATK=OFF             -DUSE_AVIF=OFF             -DUSE_JPEGXL=OFF             -DUSE_LIBINPUT=OFF             -DUSE_LCMS=OFF             -DUSE_GBM=OFF             -DUSE_LIBDRM=OFF             -DUSE_LIBBACKTRACE=OFF             -DUSE_SYSPROF_CAPTURE=OFF             -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF             -DENABLE_GPU_PROCESS=OFF             -DUSE_VULKAN=OFF             -DENABLE_WEBDRIVER=OFF             -DENABLE_GAMEPAD=OFF             -DENABLE_VIDEO=OFF             -DENABLE_WEB_AUDIO=OFF             -DENABLE_SPELLCHECKING=OFF             -DUSE_GSTREAMER=OFF             -DUSE_GSTREAMER_WEBRTC=OFF             -DUSE_OPENGL=OFF             -DUSE_LIBHYPHEN=OFF             -DENABLE_WEBXR=OFF             -DENABLE_WEB_RTC=OFF             -DENABLE_PDFJS=OFF             -DENABLE_WEB_CODECS=OFF             -DENABLE_MHTML=OFF             -DENABLE_NOTIFICATIONS=OFF             -DENABLE_OFFSCREEN_CANVAS=OFF             -DENABLE_OFFSCREEN_CANVAS_IN_WORKERS=OFF             -DENABLE_PERIODIC_MEMORY_MONITOR=OFF             -DENABLE_SHAREABLE_RESOURCE=OFF             -DENABLE_TOUCH_EVENTS=OFF             -DENABLE_VARIATION_FONTS=OFF             -DENABLE_MOUSE_CURSOR_SCALE=OFF             -DENABLE_POINTER_LOCK=OFF             -DENABLE_RESOURCE_USAGE=OFF             -DENABLE_MEMORY_SAMPLER=OFF             -DENABLE_API_TESTS=OFF             -DENABLE_LAYOUT_TESTS=OFF             -DENABLE_MINIBROWSER=OFF

      - name: Build WPE WebKit
        run: |
          cmake --build build-wpe --parallel 2

      - name: Show WPE build result
        run: |
          find build-wpe -maxdepth 5 -type f             \( -name 'libWPEWebKit*.so*' -o -name 'WebKitWebProcess' -o -name 'WPEWebProcess' \)             -print | head -50

      - name: Build authentication probe
        run: |
          cmake -S . -B build-probe -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$PWD/build-wpe"             -DPKG_CONFIG_PATH="$PWD/build-wpe/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake --build build-probe --parallel 2

      - name: Package artifact
        run: |
          mkdir -p dist/wpe-auth
          cp build-probe/wpe-auth dist/wpe-auth/
          cp README.md dist/wpe-auth/
          tar -C dist -czf wpe-auth-native.tar.gz wpe-auth
          sha256sum wpe-auth-native.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpe-auth-native
          path: wpe-auth-native.tar.gz
          if-no-files-found: error
